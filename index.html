<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>こんだてーる</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>こんだてーる</h1>
  </header>

  <main class="container">
    <!-- 献立提案エリア：ボタンを押すと料理をランダムに1つ表示する -->
    <section class="card">
      <h2>今日の献立</h2>
      <!-- タグの絞り込み：チェックしたタグが全部付いた料理だけから選ぶ（中身は script.js で作る） -->
      <div id="tag-filter" class="tag-filter"></div>
      <button type="button" id="pick-button" class="pick-button">献立を決める！</button>
      <p id="pick-result" class="pick-result" hidden></p>
      <p id="pick-error" class="error" hidden>先に料理を登録してください。</p>
      <p id="pick-no-match" class="error" hidden>この組み合わせの料理がありません。</p>
    </section>

    <section class="card">
      <h2>料理を登録する</h2>
      <form id="dish-form" class="dish-form">
        <input type="text" id="dish-name" class="name-input" placeholder="料理名（例：カレーライス）" maxlength="50">
        <!-- タグ入力欄：「、」やスペースで区切ると複数書ける（空でもOK） -->
        <input type="text" id="dish-tags" placeholder="タグ（例：がっつり、時短）" maxlength="100">
        <button type="submit">追加</button>
      </form>
      <p id="form-error" class="error" hidden>料理名を入力してください。</p>
    </section>

    <section class="card">
      <h2>登録済みの料理</h2>
      <p id="empty-message" class="empty">まだ料理が登録されていません。</p>
      <ul id="dish-list" class="dish-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
